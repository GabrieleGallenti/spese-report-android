name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test del dominio (parser, classificazione, report)
        run: ./gradlew :domain:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: spese-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Report test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: domain/build/reports/tests/

      - name: Release (solo su tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
